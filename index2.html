<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>Empleados</title>

<body>

<h2>Registro de Empleados</h2>

<form id="formulario">

    <label>Nombre:</label>
    <input type="text" id="nombre">

    <label>Cargo:</label>
    <input type="text" id="cargo">

    <button type="submit">Registrar</button>

</form>

<script src="FormularioEmpleados.js"></script>

</body>
